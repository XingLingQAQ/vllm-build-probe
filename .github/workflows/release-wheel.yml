name: Upload wheel to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'run id containing the wheel artifact'
        required: true
      artifact:
        description: 'artifact name'
        required: true
      tag:
        description: 'release tag'
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: list
        run: ls -lhR . | head -20
      - name: create/upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          W=$(find . -name "*.whl" | head -1)
          echo "wheel=$W"
          # 若 release 不存在则创建
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --title "vLLM ROCm + glm5next" --notes "auto"
          gh release upload "${{ inputs.tag }}" "$W" --clobber
          gh release view "${{ inputs.tag }}" --json assets --jq '.assets[].name'
