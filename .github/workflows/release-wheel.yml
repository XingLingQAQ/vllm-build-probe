name: Upload wheel to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'run id containing the wheel artifact'
        required: true
      artifact:
        description: 'artifact name'
        required: true
      tag:
        description: 'release tag'
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List
        run: ls -lhR .

      - name: Create/upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -x
          W=$(find . -name "*.whl" | head -1)
          echo "wheel=$W"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "vLLM ROCm 7.2 + glm5next (gfx942)" --notes "auto upload"
          gh release upload "$TAG" "$W" --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[]|"\(.name) \(.size)"'
