name: Build vLLM ROCm (glm5next)

on:
  workflow_dispatch:
    inputs:
      vllm_ref:
        description: 'vLLM git ref'
        required: false
        default: 'main'
      gpu_arch:
        description: 'ROCm GPU arch'
        required: false
        default: 'gfx942'
      max_jobs:
        description: 'parallel compile jobs'
        required: false
        default: '4'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake ninja-build git \
                                  curl wget unzip ccache python3.12-venv \
                                  python3.12-dev libnuma-dev

      - name: Install ROCm 7.2
        run: |
          set -x
          cd /tmp
          URL="https://repo.radeon.com/amdgpu-install/7.2/ubuntu/noble/amdgpu-install_7.2.70200-1_all.deb"
          wget -O amdgpu.deb "$URL" || curl -L -o amdgpu.deb "$URL"
          ls -lh amdgpu.deb
          sudo dpkg -i amdgpu.deb || sudo apt-get install -y -f
          sudo apt-get install -y
          sudo amdgpu-install -y --usecase=rocm --no-dkms
          ls -d /opt/rocm*
          /opt/rocm/bin/hipcc --version | head -2 || hipcc --version | head -2
          df -h /

      - name: Setup venv + torch
        run: |
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> $GITHUB_PATH
          /opt/venv/bin/pip install --upgrade pip setuptools wheel packaging ninja cmake
          /opt/venv/bin/pip install --index-url https://wheels.vllm.ai/rocm/torch/ torch \
            || /opt/venv/bin/pip install --index-url https://download.pytorch.org/whl/rocm7.2 torch
          /opt/venv/bin/python -c "import torch;print('torch',torch.__version__,'hip',torch.version.hip)"

      - name: Clone vLLM
        run: |
          git clone --depth 1 --branch ${{ inputs.vllm_ref }} \
            https://github.com/vllm-project/vllm.git /opt/vllm
          cd /opt/vllm
          git log --oneline -1
          echo "glm5next files: $(find vllm/models/glm5next -type f 2>/dev/null | wc -l)"

      - name: Install build requirements
        run: |
          cd /opt/vllm
          pip install -r requirements/build.txt || true
          pip install setuptools_scm setuptools-rust

      - name: Build wheel
        env:
          ROCM_PATH: /opt/rocm
          PYTORCH_ROCM_ARCH: ${{ inputs.gpu_arch }}
          VLLM_TARGET_DEVICE: rocm
          MAX_JOBS: ${{ inputs.max_jobs }}
          CMAKE_BUILD_TYPE: Release
          CCACHE_DIR: /home/runner/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cd /opt/vllm
          python setup.py bdist_wheel 2>&1 | tee /tmp/build.log
          echo "=== dist ==="
          ls -lh dist/ || true
          echo "=== tail of build.log ==="
          tail -40 /tmp/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-rocm-glm5next
          path: /opt/vllm/dist/*.whl
          retention-days: 7
          compression-level: 0
