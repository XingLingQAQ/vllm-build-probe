name: Extract vLLM from ROCm image

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'image ref'
        required: false
        default: 'vllm/vllm-openai-rocm:nightly'

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y skopeo umoci jq

      - name: Pull image
        run: |
          mkdir -p /tmp/img
          skopeo copy --override-os linux --override-arch amd64 \
            docker://${{ inputs.image }} oci:/tmp/img/out:latest
          df -h /

      - name: Unpack with umoci (rootless)
        run: |
          set -x
          umoci unpack --rootless --image /tmp/img/out:latest /tmp/bundle
          R=/tmp/bundle/rootfs
          echo "=== rootfs ==="; ls $R | head
          echo "=== 查找 vllm ==="
          find $R -maxdepth 9 -type d -name vllm -path "*packages*" 2>/dev/null | head
          echo "=== 查找 glm5next ==="
          find $R -path "*glm5next*" 2>/dev/null | head -30
          echo "=== vllm/models 列表 ==="
          V=$(find $R -maxdepth 9 -type d -name vllm -path "*packages*" | head -1)
          ls "$V/models/" 2>/dev/null || echo "无法定位 vllm/models"

      - name: Extract vllm package
        run: |
          set -x
          R=/tmp/bundle/rootfs
          V=$(find $R -maxdepth 9 -type d -name vllm -path "*packages*" | head -1)
          echo "VLLM_DIR=$V"
          mkdir -p /tmp/out
          cp -a "$V" /tmp/out/
          # dist-info
          DI=$(find $R -maxdepth 9 -name "vllm-*.dist-info" -type d | head -1)
          [ -n "$DI" ] && cp -a "$DI" /tmp/out/ || true
          echo "=== 版本 ==="
          cat /tmp/out/vllm-*.dist-info/METADATA 2>/dev/null | head -6 || true
          echo "=== glm5next 文件 ==="
          find /tmp/out -path "*glm5next*" -type f | wc -l
          find /tmp/out -path "*glm5next*" -type f | head -25
          du -sh /tmp/out

      - name: List .so files
        run: |
          find /tmp/out -name "*.so" -exec ls -lh {} \; | head -20
          find /tmp/out -name "*.so" | wc -l

      - name: Package
        run: |
          cd /tmp/out
          tar czf /tmp/vllm_extracted.tar.gz . || true
          ls -lh /tmp/vllm_extracted.tar.gz
          find /tmp/out -path "*glm5next*" > /tmp/glm5next_manifest.txt || true
          wc -l /tmp/glm5next_manifest.txt
          # 保存版本信息
          cat /tmp/out/vllm-*.dist-info/METADATA 2>/dev/null | head -10 > /tmp/vllm_version.txt || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-extracted
          path: |
            /tmp/vllm_extracted.tar.gz
            /tmp/glm5next_manifest.txt
            /tmp/vllm_version.txt
          retention-days: 7
          compression-level: 0
