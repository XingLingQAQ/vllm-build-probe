name: Build vLLM ROCm (Ubuntu 22.04, glm5next)

on:
  workflow_dispatch:
    inputs:
      vllm_ref:
        default: 'main'
      gpu_arch:
        default: 'gfx942'
      max_jobs:
        default: '4'
      torch_spec:
        default: '2.12.0+git6bbd260'
      torch_index:
        default: 'https://wheels.vllm.ai/rocm/torch/'

jobs:
  build:
    # 关键：用 22.04 容器，GLIBC 2.35，与目标机一致
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash

    steps:
      - name: Prep container
        run: |
          apt-get update -y
          apt-get install -y build-essential cmake ninja-build git curl wget \
                             unzip ccache python3.10 python3.10-venv python3.10-dev \
                             libnuma-dev software-properties-common ca-certificates \
                             gnupg lsb-release sudo
          # Python 3.12（vLLM 需要 ≥3.12）
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -y
          apt-get install -y python3.12 python3.12-venv python3.12-dev python3.12-distutils
          python3.12 --version
          ldd --version | head -1

      - name: Install ROCm 7.2
        run: |
          set -x
          cd /tmp
          URL="https://repo.radeon.com/amdgpu-install/7.2/ubuntu/jammy/amdgpu-install_7.2.70200-1_all.deb"
          wget -O amdgpu.deb "$URL"
          apt-get install -y ./amdgpu.deb
          apt-get install -y
          amdgpu-install -y --usecase=rocm --no-dkms
          ls -d /opt/rocm*
          df -h /

      - name: Setup venv + torch
        run: |
          set -x
          python3.12 -m venv /opt/venv
          echo "/opt/venv/bin" >> $GITHUB_PATH
          /opt/venv/bin/pip install --upgrade pip setuptools wheel packaging ninja "cmake>=3.26"
          /opt/venv/bin/pip install --index-url "${{ inputs.torch_index }}" "torch==${{ inputs.torch_spec }}"
          /opt/venv/bin/python -c "import torch;print('FINAL torch',torch.__version__,'hip',torch.version.hip)"

      - name: Clone vLLM
        run: |
          git clone https://github.com/vllm-project/vllm.git /opt/vllm
          cd /opt/vllm && git checkout ${{ inputs.vllm_ref }}
          git log --oneline -1
          echo "glm5next files: $(find vllm/models/glm5next -type f | wc -l)"

      - name: Install build reqs
        run: |
          cd /opt/vllm
          pip install -r requirements/build.txt || true
          pip install setuptools_scm setuptools-rust

      - name: Build wheel
        env:
          ROCM_PATH: /opt/rocm
          PYTORCH_ROCM_ARCH: ${{ inputs.gpu_arch }}
          VLLM_TARGET_DEVICE: rocm
          MAX_JOBS: ${{ inputs.max_jobs }}
          CMAKE_BUILD_TYPE: Release
          CCACHE_DIR: /root/.ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.29.2.dev0"
        run: |
          cd /opt/vllm
          python setup.py bdist_wheel 2>&1 | tee /tmp/build.log
          ls -lh dist/

      - name: Verify
        run: |
          python - <<'EOF'
          import zipfile,glob,subprocess,os
          ws=glob.glob('/opt/vllm/dist/*.whl')
          print('wheel:',ws)
          z=zipfile.ZipFile(ws[0])
          print('glm5next:',len([x for x in z.namelist() if 'glm5next' in x]))
          # 检查 GLIBC 需求
          d='/tmp/chk'; os.makedirs(d,exist_ok=True)
          z.extractall(d)
          for f in glob.glob(d+'/vllm/*.so'):
            try:
              out=subprocess.run(['objdump','-T',f],capture_output=True,text=True).stdout
              vers=sorted(set(w for w in out.split() if w.startswith('GLIBC_')), key=lambda s:[int(x) for x in s[6:].split('.')])
              print(' ',os.path.basename(f),'->',vers[-1] if vers else 'none')
            except Exception as e: print(' ',f,e)
          EOF

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: vllm-rocm-u2204-torch2.12
          path: /opt/vllm/dist/*.whl
          retention-days: 7
          compression-level: 0

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-u2204
          path: /tmp/build.log
          retention-days: 7
